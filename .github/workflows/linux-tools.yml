name: Linux tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helper-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run external-tool tests
        run: python -m unittest discover -s tests -v

      - name: Verify bundled Linux executables
        shell: bash
        run: |
          test -x tools/vgmstream/vgmstream-cli
          test -x tools/rhubarb/rhubarb

          set +e
          vgmstream_output="$(tools/vgmstream/vgmstream-cli -h 2>&1)"
          vgmstream_status=$?
          set -e
          test "$vgmstream_status" -eq 0 -o "$vgmstream_status" -eq 1
          grep -q "vgmstream CLI decoder" <<<"$vgmstream_output"

          tools/rhubarb/rhubarb --version 2>&1 | grep -q "Rhubarb Lip Sync version"
